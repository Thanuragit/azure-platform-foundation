name: terraform-dev

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-dev.yml"
      - ".github/workflows/terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-dev.yml"
      - ".github/workflows/terraform-reusable.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      plan_client_id: ${{ vars.AZURE_CLIENT_ID_DEV }}
      apply_client_id: ${{ vars.AZURE_CLIENT_ID_DEV }}