name: terraform-reusable

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      plan_client_id:
        type: string
        required: true
      apply_client_id:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ inputs.plan_client_id }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -out=${{ inputs.environment }}.tfplan
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.environment }}-plan
          path: environments/${{ inputs.environment }}/${{ inputs.environment }}.tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ inputs.apply_client_id }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.environment }}-plan
          path: environments/${{ inputs.environment }}
      - run: terraform init -input=false
      - run: terraform apply -input=false ${{ inputs.environment }}.tfplan